name: Build and Push Docker Images

on:
  workflow_call:

jobs:
  checkout:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: "prod"
          submodules: recursive

      - name: Get short SHA
        id: get_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  build_be:
    needs: checkout
    runs-on: ubuntu-latest
    env:
      CLIENT_URL: https://travelife-booking.vercel.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: "prod"
          submodules: recursive

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push travelife-be
        run: |
          docker build . -t travelife-be \
            --build-arg NODE_ENV=production \
            --build-arg CLIENT_URL=${CLIENT_URL}
          docker tag travelife-be ${{ secrets.DOCKER_USERNAME }}/travelife-be:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/travelife-be:latest

  build_python_export:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: "prod"
          submodules: recursive

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push python-export
        run: |
          docker build ./python-export -t python-export
          docker tag python-export ${{ secrets.DOCKER_USERNAME }}/python-export:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/python-export:latest

  build_notification_worker:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: "prod"
          submodules: recursive

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push notification-worker
        run: |
          docker build ./notification-worker -t notification-worker
          docker tag notification-worker ${{ secrets.DOCKER_USERNAME }}/notification-worker:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/notification-worker:latest
